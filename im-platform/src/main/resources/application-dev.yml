spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/im_platform_open?useSSL=false&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379

obs:
  endpoint: https://obs.cn-north-4.myhuaweicloud.com # 华为云OBS终端节点 (根据实际所在区域调整)
  domain: https://obs.cn-north-4.myhuaweicloud.com   # 外网访问域名（可配置CDN加速域名）
  accessKey: your-obs-ak
  secretKey: your-obs-sk
  bucketName: box-im
  imagePath: image
  filePath: file
  videoPath: video
  expireIn: 180 # 文件过期时间,单位:天

webrtc:
  max-channel: 9 # 多人通话最大通道数量，最大不能超过16,建议值:4,9,16
  iceServers:
    - urls: stun:stun.l.google.com:19302


